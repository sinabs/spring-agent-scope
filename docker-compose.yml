# 本地研发依赖：先执行 docker compose up -d，再启动应用（./gradlew bootRun）。
# 集成测试（Testcontainers）读取的也是这同一份文件，所以改这里会同时影响本地和测试。
# 只需要 Redis 时：docker compose up -d redis；要试 Nacos 再加上 nacos。
services:
  redis:
    # 固定版本，不用 latest，避免不同机器拉到不同的 Redis
    image: redis:7.4-alpine
    ports:
      # 宿主机端口默认 6379；被占用时可以 REDIS_PORT=6380 docker compose up -d，应用侧同步改 yoke.redis.uri
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  nacos:
    # 固定版本，不用 latest。选 v3.2.1-2026.03.30 是因为它与 AgentScope 2.0.4 带进来的 nacos-client（3.2.1-2026.03.30）
    # 同一个构建：AI 通道（Agent Card / Prompt）的 gRPC 协议在 3.x 各小版本间有差异，客户端和服务端版本对齐最稳
    image: nacos/nacos-server:v3.2.1-2026.03.30
    environment:
      MODE: standalone
      # ===== 仅限本地研发！以下三项关闭了鉴权，生产必须开启鉴权（NACOS_AUTH_ENABLE=true 等）并换掉下面的密钥 =====
      # 后果：没有鉴权时任何能连上 Nacos 的人都能改 Prompt，也就是能改 Yoke 的系统提示词，还能往里注册恶意的 Agent
      NACOS_AUTH_ENABLE: "false"
      # 管理接口（/v3/admin）与控制台默认也要登录，本地为了脚本和测试能直接发布 Prompt 一并关闭
      NACOS_AUTH_ADMIN_ENABLE: "false"
      NACOS_AUTH_CONSOLE_ENABLE: "false"
      # Nacos 3 不管鉴权开没开，启动脚本都要求下面三个变量非空。这是公开在仓库里的开发用假值，不是密钥；
      # TOKEN 必须是 Base64 且解码后不少于 32 字节。生产必须换成自己生成的随机值（例如 openssl rand -base64 48）
      NACOS_AUTH_TOKEN: eW9rZS1sb2NhbC1kZXYtb25seS1ub3QtYS1zZWNyZXQtMDEyMzQ1Njc4OQ==
      NACOS_AUTH_IDENTITY_KEY: yoke-dev
      NACOS_AUTH_IDENTITY_VALUE: yoke-dev
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      # 客户端 gRPC 端口必须等于主端口 + 1000（客户端按这个规则推算），所以这两个端口要一起改：
      # NACOS_PORT=18848 NACOS_GRPC_PORT=19848 docker compose up -d，应用侧 YOKE_NACOS_ADDR=127.0.0.1:18848
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"
      # 控制台（Nacos 3 的控制台是容器里单独的 8080 端口）。宿主机上映射到 18080，避开 Yoke 自己默认的 8080：http://127.0.0.1:18080
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v3/console/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 40
