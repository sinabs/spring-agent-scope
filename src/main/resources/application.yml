spring:
  application:
    name: yoke
  profiles:
    # 没有显式指定环境时默认使用 local；部署时用环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
    default: local
  threads:
    virtual:
      # 一个开关同时让 Tomcat 请求线程和 Spring 默认线程池（applicationTaskExecutor）使用虚拟线程
      enabled: true

logging:
  pattern:
    console: "%red(%d{yyyy-MM-dd HH:mm:ss}) %green([%thread]) %highlight(%-5level) %green(%X{traceId:-},%X{spanId:-}) %boldMagenta(%logger{50}) - %cyan(%msg%n)"

yoke:
  # HarnessAgent 的工作区：压缩前转存的消息、记忆文件等放在这里，只在本机，不随会话历史进 Redis
  workspace: ${user.home}/.yoke/workspace
  redis:
    # 所有 Redis 键的统一前缀；连接串 uri 见各环境文件，没有默认值
    key-prefix: "yoke:"
    # uri 的写法示例（各环境文件里通过 YOKE_REDIS_URI 提供，下面都是注释，不会生效）：
    # 本机无密码：          redis://127.0.0.1:6379
    # 只有密码：            redis://:your-password@redis.example.com:6379
    # 用户名加密码（ACL）：  redis://yoke:your-password@redis.example.com:6379
    # 指定 DB（默认 0）：    redis://127.0.0.1:6379/2
    # 密码加 DB：           redis://:your-password@redis.example.com:6379/2
    # TLS：                 rediss://:your-password@redis.example.com:6380
    # 密码里有 @ / : 等特殊字符时需要 URL 编码，例如 p@ss 写成 p%40ss
  compaction:
    # 对话消息达到 trigger-messages 条就压缩，压缩后原样保留最近 keep-messages 条；<=0 的非法值回落到 30 / 10
    trigger-messages: 30
    keep-messages: 10

# Agent 与模型由 AgentScope 官方 starter 根据下面的配置自动创建
# 这里只放各环境通用的配置，密钥和环境差异见 application-{profile}.yml
agentscope:
  model:
    provider: openai
  openai:
    model-name: gpt-4.1-mini
    # 使用其他 OpenAI 兼容服务时设置 base-url，例如 DashScope：
    # base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  agent:
    # 关闭官方的单例 Agent：Agent 由 HarnessAgentFactory 在每次请求时新建
    # （Builder 也是每次现建，不共享）。name、sys-prompt、max-iters 仍然生效，被工厂读取
    enabled: false
    name: Yoke
    sys-prompt: 你是一个乐于助人的 AI 助手，请用简洁清晰的中文回答。
    max-iters: 10
