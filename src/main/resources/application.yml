spring:
  application:
    name: yoke
  profiles:
    # 没有显式指定环境时默认使用 local；部署时用环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
    default: local
  threads:
    virtual:
      # 一个开关同时让 Tomcat 请求线程和 Spring 默认线程池（applicationTaskExecutor）使用虚拟线程
      enabled: true

# 可观测：只暴露这四个端点，其余（env、beans、heapdump、configprops 等）一律不暴露；断言见 ActuatorExposureTests。
# 这些端点和业务接口在同一个端口、同样没有认证：health/info 无害，metrics/prometheus 会泄露内部指标，
# 生产要么放在网关后面，要么用 MANAGEMENT_SERVER_PORT 改到单独的内部端口（Boot 的宽松绑定直接生效，不需要改这个文件）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 只返回 UP/DOWN，不返回各组件的明细（连接串、磁盘路径等）
      show-details: never
  info:
    env:
      # info 端点只回显下面 info.* 开头的静态配置，不是整个环境
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: Yoke

logging:
  level:
    # 主 Agent 同时用了 disableWebTools() 和 ToolsConfig.deny：web 工具没注册，ToolFilter 每次构建对 deny 里的名字打 WARN，
    # 摘要子 Agent 的占位白名单名也一样。这些是预期内的噪音，调到 ERROR；配置写错的风险由 SubagentTests 守着
    io.agentscope.harness.agent.tools.ToolFilter: ERROR
  pattern:
    console: "%red(%d{yyyy-MM-dd HH:mm:ss}) %green([%thread]) %highlight(%-5level) %green(%X{traceId:-},%X{spanId:-}) %boldMagenta(%logger{50}) - %cyan(%msg%n)"

yoke:
  # HarnessAgent 的工作区：压缩前转存的消息、记忆文件等放在这里，只在本机，不随会话历史进 Redis
  workspace: ${user.home}/.yoke/workspace
  redis:
    # 所有 Redis 键的统一前缀；连接串 uri 见各环境文件，没有默认值
    key-prefix: "yoke:"
    # uri 的写法示例（各环境文件里通过 YOKE_REDIS_URI 提供，下面都是注释，不会生效）：
    # 本机无密码：          redis://127.0.0.1:6379
    # 只有密码：            redis://:your-password@redis.example.com:6379
    # 用户名加密码（ACL）：  redis://yoke:your-password@redis.example.com:6379
    # 指定 DB（默认 0）：    redis://127.0.0.1:6379/2
    # 密码加 DB：           redis://:your-password@redis.example.com:6379/2
    # TLS：                 rediss://:your-password@redis.example.com:6380
    # 密码里有 @ / : 等特殊字符时需要 URL 编码，例如 p@ss 写成 p%40ss
  compaction:
    # 对话消息达到 trigger-messages 条就压缩，压缩后原样保留最近 keep-messages 条；<=0 的非法值回落到 30 / 10
    trigger-messages: 30
    keep-messages: 10
  knowledge:
    # 知识库检索（retrieve 工具）：语料是 classpath:knowledge/*.md。
    # embedding 的 model-name 和 api-key 都有值才启用向量检索（与关键词检索融合）；任意一个为空就只用关键词检索，
    # 向量化服务出错时也会自动退回关键词。密钥见各环境文件，base-url 可换成其他 OpenAI 兼容服务。
    # protocol 默认 openai（OpenAI 兼容的 /embeddings）；火山方舟的多模态向量模型要写 ark-multimodal
    embedding:
      model-name: ${YOKE_EMBEDDING_MODEL:}
      base-url: ${YOKE_EMBEDDING_BASE_URL:https://api.openai.com/v1}
  # 外部 MCP 服务，默认一个也不接。只允许 HTTP 传输（sse 或 streamable-http），配置 stdio 会让应用启动失败；
  # 连不上也会启动失败。接入后服务端公布的工具以原名出现在模型的工具清单里；
  # 只有服务端声明了 readOnlyHint 的工具会被注册，其余需要用户确认，而 HTTP 接口没有确认通道，所以不暴露给模型。示例：
  # mcp:
  #   servers:
  #     - name: docs
  #       transport: streamable-http
  #       url: https://mcp.example.com/mcp
  #       timeout: 30s
  #       headers:
  #         Authorization: Bearer ${MCP_DOCS_TOKEN}

  # A2A 互通与 Nacos 接线，全部默认关闭
  a2a:
    server:
      # 开启就是暴露一个无认证的入口（POST /a2a 与 GET /.well-known/agent-card.json），能力等价于 /api/chat，
      # 调用方还能自报 userId。生产必须放在网关后面，或者配置 token（下面的环境变量），详见 A2aApi
      enabled: false
      # 可选的 Bearer Token；不配置则不校验（开启服务端时启动日志会打 WARN）；配置了但少于 16 个字符则启动失败。
      # 只从环境变量取，不要写进仓库。注意 token 走的是 HTTP 明文：生产要用 https 的 public-url，或由网关终结 TLS
      token: ${YOKE_A2A_TOKEN:}
      # 外部能访问到的根地址，写进 Agent Card 和 Nacos 注册；不配置时是 http://localhost:{server.port}
      public-url: ${YOKE_A2A_PUBLIC_URL:}
      timeout: 120s
      # JSON-RPC 请求体上限（字节），默认 256 KB，超过返回 413（认证先于读体，超限不读体）
      max-body-bytes: 262144
      card:
        version: 1.0.0
        skills:
          - id: chat
            name: 通用问答
            description: 用中文回答问题，可以使用时间、计算和知识库检索工具
            tags: [chat, qa]
    remote:
      # 远端 A2A Agent（well-known 直连）：只在这里配置，请求体不能影响调用的目标。不配置就没有 /api/chat/remote
      url: ${YOKE_A2A_REMOTE_URL:}
      # 或者按名字从 Nacos 发现（要求 yoke.nacos.a2a.enabled=true，两个都配时用 Nacos）
      agent-name: ${YOKE_A2A_REMOTE_AGENT_NAME:}
      token: ${YOKE_A2A_REMOTE_TOKEN:}
      timeout: 30s
  # Nacos：一条 gRPC 通道承载 Prompt / Agent Card 等数据，AI 通道需要 Nacos 3.x（gRPC 端口 = 主端口 + 1000，默认 9848）。
  # 三个开关互不绑死，任何一个打开，启动时都会先探活，连不上直接启动失败。用户名密码只从环境变量取
  nacos:
    server-addr: ${YOKE_NACOS_ADDR:127.0.0.1:8848}
    namespace: ${YOKE_NACOS_NAMESPACE:}
    username: ${YOKE_NACOS_USERNAME:}
    password: ${YOKE_NACOS_PASSWORD:}
    a2a:
      # 注册发现：服务端开启时把 Agent Card 注册进去；配了 yoke.a2a.remote.agent-name 时从这里发现远端
      enabled: false
    prompt:
      # Prompt 热更新：每轮对话把 Nacos 里最新的提示词追加到内置提示词之后（子 Agent 也会带上，实测）。
      # 信任边界：谁能写 Nacos 里这个 Key，谁就能改 Yoke 的系统提示词，来源必须受信，生产必须开启 Nacos 鉴权。
      # 每轮拉取有超时，超时或失败时沿用内置提示词
      enabled: false
      key: yoke-system-prompt
      timeout: 2s

# Agent 与模型由 AgentScope 官方 starter 根据下面的配置自动创建
# 这里只放各环境通用的配置，密钥和环境差异见 application-{profile}.yml
agentscope:
  model:
    provider: openai
  openai:
    model-name: gpt-4.1-mini
    # 使用其他 OpenAI 兼容服务时设置 base-url，例如 DashScope：
    # base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  agent:
    # 关闭官方的单例 Agent：Agent 由 HarnessAgentFactory 在每次请求时新建
    # （Builder 也是每次现建，不共享）。name、sys-prompt、max-iters 仍然生效，被工厂读取
    enabled: false
    name: Yoke
    sys-prompt: 你是一个乐于助人的 AI 助手，请用简洁清晰的中文回答。
    max-iters: 10
