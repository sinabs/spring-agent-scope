# 每次推送和 PR 都用 gitleaks 扫描整个提交历史，发现疑似密钥就让检查失败。
# 与本地的 pre-commit 钩子配合：钩子给提交者即时反馈，这里对所有协作者强制生效。
# 误报白名单配置见根目录 .gitleaks.toml（下面 env 里显式指定，不依赖自动发现）。
name: Secret scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      # 需要完整历史，否则只能扫描最近一个提交
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # 个人账号免费使用；仓库迁到组织账号后，需要在仓库 secrets 里配置 GITLEAKS_LICENSE。
      # gitleaks-action v3.0.0 默认内置 8.24.3，而 .gitleaks.toml 使用的 [[allowlists]] 需要 8.25+，这里固定版本与本地对齐
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
