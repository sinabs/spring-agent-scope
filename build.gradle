plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 版本统一交给 BOM 管理，下面的依赖都不需要写版本号
    implementation platform(libs.spring.boot.dependencies)
    implementation platform(libs.agentscope.bom)

    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.validation
    // 官方核心 starter：根据 agentscope.* 配置自动创建 ReActAgent
    implementation libs.agentscope.starter
    // Harness 工程层：HarnessAgent 在 ReActAgent 之上补齐工作区、压缩、中间件等生产能力
    implementation libs.agentscope.harness
    // Redis 分布式存储（RedisDistributedStore，基于 Jedis）：会话历史放在进程之外，重启和多副本都能接上
    implementation(libs.agentscope.redis) {
        // 扩展同时带进 Redisson 和 Lettuce 两套客户端，Yoke 只用 Jedis，排除后体积更小，也避免 Lettuce 版本被 Boot 的 BOM 改写
        exclude group: 'org.redisson'
        exclude group: 'io.lettuce'
    }
    // 模型 starter：这里选 OpenAI 兼容协议，改 base-url 即可接入 DashScope、DeepSeek 等；换模型只需替换这一行
    implementation libs.agentscope.openai.starter

    // Lombok 只在编译期使用；这几个配置不继承 implementation，需要单独引入 BOM 才能省略版本号
    ['compileOnly', 'annotationProcessor', 'testCompileOnly', 'testAnnotationProcessor'].each { configuration ->
        add(configuration, platform(libs.spring.boot.dependencies))
        add(configuration, libs.lombok)
    }

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.webmvc.test
    // 用测试守住包之间的依赖边界（框架类型不外泄）
    testImplementation libs.archunit
    // 用 docker-compose.yml 拉起真实 Redis 做集成测试
    testImplementation libs.testcontainers
    testImplementation libs.testcontainers.junit
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
